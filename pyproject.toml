[project]
name = "hitl-approval-agent"
version = "0.1.0"
description = "Human-in-the-loop approval agent: uncertainty detection, pause, validated human input, resume, full audit trail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hitl = "hitl_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hitl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
